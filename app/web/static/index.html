<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuickCommerce India — one search, every app, the best deal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: "Bricolage Grotesque", "Plus Jakarta Sans", sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  .tnum { font-variant-numeric: tabular-nums; }
  ::selection { background: var(--primary); color: var(--primary-ink); }

  :root {
    --maxw: 1080px;
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px;
    --pad-card: 22px;
    --shadow-sm: 0 1px 2px rgba(20,12,4,.06), 0 1px 1px rgba(20,12,4,.04);
    --shadow-md: 0 6px 20px -8px rgba(30,18,6,.18), 0 2px 6px -2px rgba(30,18,6,.08);
    --shadow-lg: 0 20px 48px -16px rgba(30,18,6,.28), 0 4px 12px -4px rgba(30,18,6,.10);
  }
  /* density */
  [data-density="compact"] { --pad-card: 16px; }
  [data-density="comfy"]   { --pad-card: 28px; }

  /* ============ layout ============ */
  .app-shell { min-height: 100vh; background: var(--bg); color: var(--ink); }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }

  header.app {
    position: sticky; top: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .hdr-row { display: flex; align-items: center; gap: 14px; height: 64px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    background: var(--primary); color: var(--primary-ink); box-shadow: var(--shadow-sm);
    flex: none;
  }
  .brand .wm { font-family: "Bricolage Grotesque"; font-size: 19px; line-height: 1; }
  .brand .wm small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .14em;
    color: var(--muted); text-transform: uppercase; margin-top: 2px; font-family: "Plus Jakarta Sans"; }
  .hdr-spacer { flex: 1; }
  .loc {
    display: inline-flex; align-items: center; gap: 7px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 13px; font-size: 13px;
    font-weight: 600; color: var(--ink); box-shadow: var(--shadow-sm); white-space: nowrap;
  }
  .loc .city { color: var(--muted); font-weight: 600; }
  .loc.clickable { cursor: pointer; border: 0; font-family: inherit; }
  .loc.clickable:hover { border-color: var(--primary); color: var(--primary); }

  /* location picker modal */
  .loc-or { display: flex; align-items: center; gap: 10px; margin: 4px 0 16px; color: var(--muted);
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .loc-or::before, .loc-or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .loc-field { margin-bottom: 12px; }
  .loc-field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .loc-field select, .loc-field input {
    width: 100%; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2);
    color: var(--ink); padding: 11px 13px; font-size: 14.5px; font-family: inherit;
  }
  .loc-field select:focus, .loc-field input:focus { outline: none; border-color: var(--primary); }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); display: grid; place-items: center; color: var(--ink);
    box-shadow: var(--shadow-sm); position: relative; flex: none;
  }
  .icon-btn:hover { border-color: color-mix(in srgb, var(--primary) 50%, var(--line)); }
  .cart-dot { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 999px; background: var(--primary); color: var(--primary-ink); font-size: 11px;
    font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }

  /* ============ hero / search ============ */
  .hero { padding: 40px 0 8px; }
  .hero h1 {
    font-size: clamp(30px, 5.4vw, 50px); line-height: 1.02; letter-spacing: -.025em;
    margin: 0 0 12px; font-weight: 800; max-width: 24ch; text-wrap: balance;
  }
  .hero h1 .hl { color: var(--primary); }
  .hero .lede { color: var(--muted); font-size: clamp(15px, 2vw, 18px); margin: 0 0 26px; max-width: 52ch; }

  .searchbar {
    display: flex; align-items: center; gap: 10px; background: var(--surface);
    border: 1.5px solid var(--line); border-radius: var(--r-xl); padding: 8px 8px 8px 18px;
    box-shadow: var(--shadow-md); transition: border-color .2s, box-shadow .2s;
  }
  .searchbar:focus-within { border-color: var(--primary); box-shadow: var(--shadow-lg); }
  .searchbar .spark { color: var(--primary); flex: none; }
  .searchbar input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font-size: clamp(15px, 2.1vw, 17px); font-family: inherit; font-weight: 500; padding: 12px 0;
  }
  .searchbar input::placeholder { color: var(--muted); }
  .searchbar input:focus { outline: none; }
  .btn-go {
    border: 0; border-radius: 18px; background: var(--primary); color: var(--primary-ink);
    font-weight: 800; font-size: 15px; padding: 13px 22px; display: inline-flex; align-items: center;
    gap: 8px; flex: none; box-shadow: 0 4px 14px -4px color-mix(in srgb, var(--primary) 70%, transparent);
    transition: transform .12s ease, filter .2s;
  }
  .btn-go:hover { filter: brightness(1.05); }
  .btn-go:active { transform: scale(.97); }

  .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; align-items: center; }
  .chips .lbl { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-right: 2px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 7px; transition: all .15s ease;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
  .chip .em { font-size: 14px; }

  /* control bar */
  .controls { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-top: 22px; }
  .seg-toggle {
    display: inline-flex; align-items: center; gap: 9px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 7px 6px 14px; font-weight: 600;
    font-size: 13.5px; box-shadow: var(--shadow-sm); user-select: none;
  }
  .switch { width: 40px; height: 23px; border-radius: 999px; background: var(--line); position: relative;
    transition: background .2s; flex: none; }
  .switch.on { background: var(--good); }
  .switch i { position: absolute; top: 2px; left: 2px; width: 19px; height: 19px; border-radius: 50%;
    background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .switch.on i { transform: translateX(17px); }
  .veg-mark { width: 15px; height: 15px; border: 1.5px solid var(--good); border-radius: 3px;
    display: grid; place-items: center; flex: none; }
  .veg-mark i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

  .mem-group { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mem-chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    border-radius: 999px; padding: 8px 13px; font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 7px; transition: all .15s ease;
  }
  .mem-chip .tick { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line);
    display: grid; place-items: center; flex: none; transition: all .15s; }
  .mem-chip.on { color: var(--ink); border-color: var(--primary); background: var(--primary-soft); }
  .mem-chip.on .tick { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }

  .platrow { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 4px; }
  .plat-toggle {
    display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line);
    background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 12.5px;
    font-weight: 600; color: var(--muted); transition: all .15s;
  }
  .plat-toggle.on { color: var(--ink); border-color: color-mix(in srgb, var(--primary) 35%, var(--line)); }
  .plat-toggle.off { opacity: .5; }
  .linkbtn { background: none; border: 0; color: var(--primary); font-weight: 700; font-size: 12.5px; padding: 4px 6px; }
  .linkbtn:hover { text-decoration: underline; }

  /* platform monogram badge */
  .pbadge { border-radius: 9px; display: grid; place-items: center; font-weight: 800; flex: none;
    color: #fff; font-family: "Bricolage Grotesque"; letter-spacing: -.02em; }

  /* ============ results ============ */
  .results { padding: 18px 0 80px; display: flex; flex-direction: column; gap: 34px; }
  .liveline { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--good);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); }
    70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  .item-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .item-head h2 { font-size: clamp(21px, 3vw, 27px); margin: 0; letter-spacing: -.02em; font-weight: 700; }
  .unit-badge { font-size: 12.5px; color: var(--muted); font-weight: 600; background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .kind-badge { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    color: var(--primary); }

  /* best pick card */
  .bestpick { position: relative; background: var(--surface); border: 1.5px solid transparent;
    border-radius: var(--r-xl); box-shadow: var(--shadow-lg); overflow: hidden;
    background-clip: padding-box; }
  .bestpick::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px;
    background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 30%, var(--good)));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
  .bp-ribbon { display: inline-flex; align-items: center; gap: 7px; background: var(--primary);
    color: var(--primary-ink); font-size: 11.5px; font-weight: 800; letter-spacing: .07em;
    text-transform: uppercase; padding: 7px 14px; border-bottom-right-radius: 14px; }
  .bp-body { padding: 8px var(--pad-card) var(--pad-card); }
  .bp-top { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .bp-plat { display: flex; align-items: center; gap: 12px; }
  .bp-plat .pname { font-family: "Bricolage Grotesque"; font-weight: 700; font-size: 19px; }
  .bp-plat .ptier { font-size: 11.5px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .bp-price { margin-left: auto; text-align: right; }
  .bp-price .now { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: clamp(30px, 6vw, 40px);
    line-height: 1; letter-spacing: -.03em; }
  .bp-price .save { display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; font-size: 12.5px;
    font-weight: 800; color: var(--good); background: var(--good-soft); padding: 4px 9px; border-radius: 999px; }
  .bp-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .stat { display: inline-flex; align-items: center; gap: 7px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 12px; padding: 9px 13px; font-size: 13.5px; font-weight: 600; }
  .stat .k { color: var(--muted); font-weight: 600; }
  .offer-chip { background: var(--good-soft); color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 25%, transparent);
    border-radius: 999px; padding: 8px 13px; font-size: 13px; font-weight: 700; display: inline-flex; gap: 7px; align-items: center; }

  /* because block */
  .because { margin-top: 18px; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-md); padding: 15px 16px; }
  .because .head { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800;
    letter-spacing: .09em; text-transform: uppercase; color: var(--primary); margin-bottom: 9px; white-space: nowrap; }
  .because ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .because li { display: flex; gap: 9px; font-size: 14px; color: var(--ink); align-items: flex-start; line-height: 1.45; }
  .because li .dot { color: var(--primary); flex: none; margin-top: 1px; }
  .because strong { font-weight: 800; }

  .conf { margin-top: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .conf .label { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .conf-bar { height: 7px; border-radius: 999px; background: var(--line); overflow: hidden; flex: 1; min-width: 120px; max-width: 220px; }
  .conf-bar i { display: block; height: 100%; border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .conf-tag { font-size: 12.5px; font-weight: 800; white-space: nowrap; }
  .conf-high { color: var(--good); } .conf-medium { color: var(--primary); } .conf-low { color: var(--warn); }

  .bp-cta { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
  .btn-order {
    flex: 1; min-width: 200px; border: 0; border-radius: 14px; background: var(--primary);
    color: var(--primary-ink); font-weight: 800; font-size: 16px; padding: 15px 20px;
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--primary) 70%, transparent); transition: transform .12s, filter .2s;
  }
  .btn-order { white-space: nowrap; }
  .btn-order:hover { filter: brightness(1.05); }
  .btn-order:active { transform: scale(.985); }
  .btn-secondary { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 14px; font-weight: 700; font-size: 14px; padding: 14px 18px; }
  .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

  /* alternatives */
  .alts-h { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .04em;
    text-transform: uppercase; margin: 22px 0 12px; }
  .alts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .alt {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 15px; box-shadow: var(--shadow-sm); transition: transform .14s, box-shadow .2s, border-color .2s;
    display: flex; flex-direction: column; gap: 11px;
  }
  .alt:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: color-mix(in srgb, var(--primary) 30%, var(--line)); }
  .alt-top { display: flex; align-items: center; gap: 10px; }
  .alt-top .nm { font-weight: 700; font-size: 14.5px; }
  .alt-tag { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px; margin-left: auto; }
  .tag-cheap { background: var(--good-soft); color: var(--good); }
  .tag-fast  { background: color-mix(in srgb, var(--blue) 16%, transparent); color: var(--blue); }
  .tag-rated { background: color-mix(in srgb, var(--star) 18%, transparent); color: color-mix(in srgb, var(--star) 80%, var(--ink)); }
  .alt-price { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 23px; letter-spacing: -.02em; }
  .alt-meta { display: flex; gap: 12px; font-size: 12.5px; color: var(--muted); font-weight: 600; flex-wrap: wrap; }
  .alt-via { font-size: 11.5px; color: var(--muted); font-weight: 600; margin: -4px 0 6px; }
  .alt-order { margin-top: 2px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    border-radius: 10px; font-weight: 700; font-size: 13px; padding: 9px; transition: all .15s; }
  .alt-order:hover { border-color: var(--primary); color: var(--primary); }

  /* full table */
  .table-card { margin-top: 18px; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
    background: var(--surface); box-shadow: var(--shadow-sm); }
  .table-head { padding: 13px 18px; font-size: 12.5px; font-weight: 700; color: var(--muted);
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .table-head .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
  .table-head.open .chev { transform: rotate(180deg); }
  table.cmp { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.cmp th { text-align: left; padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 12px;
    border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.cmp th.num, table.cmp td.num { text-align: right; }
  table.cmp td { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  table.cmp tr:last-child td { border-bottom: 0; }
  table.cmp tr.best-row { background: var(--primary-soft); }
  .row-plat { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .row-tags { display: inline-flex; gap: 5px; margin-left: 6px; }
  .row-via { font-size: 11px; color: var(--muted); font-weight: 600; }
  .minitag { font-size: 9.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 5px; }
  .price-cell { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
  .oos { color: var(--warn); font-weight: 700; font-size: 12.5px; }
  .tbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px;
    font-weight: 700; font-size: 13px; padding: 8px 14px; transition: all .15s; }
  .tbtn:hover { border-color: var(--primary); color: var(--primary); }
  .tbtn:disabled { opacity: .4; cursor: not-allowed; }

  /* mobile card list (instead of table) */
  .cmp-cards { display: none; flex-direction: column; }
  .cmp-card { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
  .cmp-card:last-child { border-bottom: 0; }
  .cmp-card.best-row { background: var(--primary-soft); }
  .cmp-card .cc-main { flex: 1; min-width: 0; }
  .cmp-card .cc-nm { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .cmp-card .cc-meta { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .cmp-card .cc-price { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 17px; text-align: right; }

  /* meta lines */
  .softnote { font-size: 12.5px; color: var(--muted); margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; }
  .softnote .ic { flex: none; margin-top: 1px; }

  /* abstain */
  .abstain { background: color-mix(in srgb, var(--warn) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line));
    border-radius: var(--r-md); padding: 16px 18px; display: flex; gap: 12px; align-items: flex-start; }
  .abstain .ic { color: var(--warn); flex: none; }
  .abstain h3 { margin: 0 0 4px; font-size: 15px; }
  .abstain p { margin: 0; color: var(--muted); font-size: 13.5px; }

  /* thinking / skeleton */
  .thinking { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl);
    padding: var(--pad-card); box-shadow: var(--shadow-md); }
  .think-line { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
  .think-line .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line);
    border-top-color: var(--primary); animation: spin .7s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .think-sub { color: var(--muted); font-size: 13px; margin-top: 6px; min-height: 18px; }
  .skel-row { display: flex; gap: 12px; margin-top: 18px; }
  .skel { background: linear-gradient(90deg, var(--line) 25%, color-mix(in srgb, var(--line) 40%, var(--surface)) 50%, var(--line) 75%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 8px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* empty */
  .empty { text-align: center; padding: 56px 20px; }
  .empty .big { font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 26px; margin: 14px 0 8px; }
  .empty p { color: var(--muted); margin: 0 auto 20px; max-width: 44ch; }

  /* order modal */
  .modal-scrim { position: fixed; inset: 0; background: rgba(20,12,4,.5); backdrop-filter: blur(3px);
    display: grid; place-items: center; z-index: 60; padding: 20px; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; } }
  .modal { background: var(--surface); border-radius: var(--r-xl); width: 100%; max-width: 440px;
    box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .24s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { transform: scale(.93) translateY(10px); opacity: 0; } }
  .modal-hd { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .modal-hd .shield { color: var(--good); flex: none; }
  .modal-hd h3 { margin: 0; font-size: 16px; }
  .modal-bd { padding: 20px 22px; }
  .order-line { display: flex; align-items: center; gap: 13px; padding: 14px; background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--r-md); }
  .order-line .ol-nm { font-weight: 700; }
  .order-line .ol-sub { font-size: 12.5px; color: var(--muted); }
  .order-line .ol-price { margin-left: auto; font-family: "Bricolage Grotesque"; font-weight: 800; font-size: 22px; }
  .idem { font-size: 11.5px; color: var(--muted); margin-top: 14px; display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .idem code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
    font-size: 11px; color: var(--ink); }
  .modal-note { font-size: 12.5px; color: var(--muted); margin: 14px 0 0; display: flex; gap: 8px; align-items: flex-start; }
  .modal-ft { display: flex; gap: 10px; padding: 0 22px 22px; }
  .modal-ft .btn-order { flex: 2; min-width: 0; font-size: 15px; padding: 14px; }
  .modal-ft .btn-secondary { flex: 1; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 70;
    background: var(--ink); color: var(--bg); border-radius: 14px; padding: 14px 18px; display: flex; gap: 11px;
    align-items: center; box-shadow: var(--shadow-lg); max-width: 92vw; animation: toastin .3s cubic-bezier(.2,.9,.3,1.2); }
  .toast .tk { width: 24px; height: 24px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; flex: none; }
  .toast .tt { font-weight: 700; font-size: 14px; }
  .toast .ts { font-size: 12px; opacity: .8; }
  @keyframes toastin { from { transform: translate(-50%, 16px); opacity: 0; } }

  footer.app { border-top: 1px solid var(--line); padding: 22px 0 34px; }
  footer.app .ft { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 12.5px; color: var(--muted); }
  footer.app .ft .sim { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }

  @media (max-width: 720px) {
    .hdr-row { height: 58px; gap: 10px; }
    /* Location stays reachable on mobile (tap to detect/change) — just tightened,
       since this is the primary way to set delivery location on a phone. */
    .loc { max-width: 118px; overflow: hidden; text-overflow: ellipsis; padding: 8px 10px; }
    .loc .city { display: none; }
    .hero { padding: 26px 0 4px; }
    .btn-go span.t { display: none; }
    .btn-go { padding: 13px 15px; }
    table.cmp { display: none; }
    .cmp-cards { display: flex; }
    .bp-price { margin-left: 0; text-align: left; }
    .bp-top { gap: 10px; }
    .alts { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 460px) { .alts { grid-template-columns: 1fr; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · QuickCommerce India</title>
  <style>
    :root {
      --bg: #0f0d0a; --panel: #1a1410; --line: #3a2f1e; --ink: #e8dcc0;
      --muted: #a8997a; --accent: #f0a030; --good: #4caf50; --warn: #e57373;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font: 15px/1.5 system-ui, sans-serif; background: radial-gradient(1200px 600px at 50% -10%, #1c1206, var(--bg)); color: var(--ink); }
    .card { width: 380px; max-width: 92vw; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; }
    .brand { font-size: 20px; font-weight: 700; }
    .tagline { color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 2px; }
    .sub { color: var(--muted); font-size: 12px; margin: 4px 0 18px; }
    .tabs { display: flex; gap: 6px; background: #0c0a07; border: 1px solid var(--line); border-radius: 9px; padding: 4px; margin-bottom: 14px; }
    .tab { flex: 1; text-align: center; padding: 8px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 600; }
    .tab.active { background: var(--accent); color: #1a1006; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
    input { width: 100%; background: #0c0a07; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; font-size: 15px; }
    button.primary { width: 100%; margin-top: 16px; background: var(--accent); color: #1a1006; border: 0; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    button.primary:disabled { opacity: .55; cursor: default; }
    .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 18px 0; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .sso { display: flex; flex-direction: column; gap: 8px; }
    .sso button { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; background: #15110c; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .sso button:hover { border-color: var(--accent); }
    .ic { width: 16px; height: 16px; display: inline-block; }
    .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .msg.err { color: var(--warn); }
    .msg.ok { color: var(--good); }
    .demo { margin-top: 16px; padding: 9px 11px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 11.5px; }
    .demo b { color: var(--accent); }
    .hidden { display: none; }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">QuickCommerce India</div>
    <div class="tagline">One search. Every app. The best deal.</div>
    <div class="sub">Sign in to save preferences and memberships.</div>

    <div class="tabs">
      <div class="tab active" id="tab-password" role="button">Password</div>
      <div class="tab" id="tab-otp" role="button">OTP</div>
    </div>

    <label for="identifier">Email or phone</label>
    <input type="text" id="identifier" placeholder="you@example.com  or  +91 98765 43210" autocomplete="username" autofocus />

    <!-- Password method -->
    <div id="method-password">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      <button class="primary" id="btn-password">Log in</button>
    </div>

    <!-- OTP method -->
    <div id="method-otp" class="hidden">
      <button class="primary" id="btn-send-otp">Send code</button>
      <div id="otp-stage" class="hidden">
        <label for="otp">Enter the 6-digit code</label>
        <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" />
        <button class="primary" id="btn-verify-otp">Verify &amp; sign in</button>
      </div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="divider">or continue with</div>
    <div class="sso">
      <button id="sso-google"><span class="ic">🔵</span> Continue with Google</button>
      <button id="sso-apple"><span class="ic"></span> Continue with Apple</button>
    </div>

    <div class="demo">
      <b>Demo build</b> — no real SMS/OAuth. Password account:
      <b>demo@quickcommerce.in</b> / <b>demo1234</b>. OTP &amp; SSO are simulated;
      the OTP is shown on screen after you tap “Send code”.
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const msg = $('msg');
function showMsg(text, kind) { msg.textContent = text; msg.className = 'msg ' + (kind || ''); }
function goHome() { showMsg('Signed in — redirecting…', 'ok'); setTimeout(() => location.href = '/', 500); }

// Tabs
function setMethod(method) {
  const pw = method === 'password';
  $('tab-password').classList.toggle('active', pw);
  $('tab-otp').classList.toggle('active', !pw);
  $('method-password').classList.toggle('hidden', !pw);
  $('method-otp').classList.toggle('hidden', pw);
  showMsg('', '');
}
$('tab-password').addEventListener('click', () => setMethod('password'));
$('tab-otp').addEventListener('click', () => setMethod('otp'));

async function postJSON(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, data };
}

// Password login
$('btn-password').addEventListener('click', async () => {
  const identifier = $('identifier').value.trim();
  const password = $('password').value;
  if (!identifier || !password) { showMsg('Enter your email/phone and password.', 'err'); return; }
  showMsg('Signing in…');
  const { ok, data } = await postJSON('/api/auth/password', { identifier, password });
  if (ok) goHome(); else showMsg(data.error || 'Sign-in failed.', 'err');
});

// OTP request
$('btn-send-otp').addEventListener('click', async () => {
  const identifier = $('identifier').value.trim();
  if (!identifier) { showMsg('Enter your email or phone first.', 'err'); return; }
  showMsg('Sending code…');
  const { ok, data } = await postJSON('/api/auth/otp/request', { identifier });
  if (!ok) { showMsg(data.error || 'Could not send code.', 'err'); return; }
  $('otp-stage').classList.remove('hidden');
  if (data.demo_otp) showMsg('Demo code (normally sent via SMS/email): ' + data.demo_otp, 'ok');
  else showMsg('Code sent to ' + (data.to || 'your device') + '.', 'ok');
});

// OTP verify
$('btn-verify-otp').addEventListener('click', async () => {
  const identifier = $('identifier').value.trim();
  const otp = $('otp').value.trim();
  if (!otp) { showMsg('Enter the code.', 'err'); return; }
  showMsg('Verifying…');
  const { ok, data } = await postJSON('/api/auth/otp/verify', { identifier, otp });
  if (ok) goHome(); else showMsg(data.error || 'Verification failed.', 'err');
});

// SSO (simulated)
async function sso(provider) {
  showMsg('Connecting to ' + provider + '…');
  const { ok, data } = await postJSON('/api/auth/sso', { provider });
  if (ok) goHome(); else showMsg(data.error || 'SSO failed.', 'err');
}
$('sso-google').addEventListener('click', () => sso('google'));
$('sso-apple').addEventListener('click', () => sso('apple'));
</script>
</body>
</html>
